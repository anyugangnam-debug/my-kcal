<script>
(function renderLogo() {
  const imgEl = document.querySelector('.logo-img');
  if (!imgEl) return;
  const src = imgEl.getAttribute('src');
  const img = new Image();
  img.onload = () => {
    const off = document.createElement('canvas');
    off.width = img.width; off.height = img.height;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0);
    const data = octx.getImageData(0, 0, off.width, off.height);
    const d = data.data;
    let minX = off.width, minY = off.height, maxX = 0, maxY = 0;
    const floor = 200, ceil = 250;
    for (let y = 0; y < off.height; y++) {
      for (let x = 0; x < off.width; x++) {
        const i = (y * off.width + x) * 4;
        const whiteness = Math.min(d[i], d[i+1], d[i+2]);
        if (whiteness <= floor) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
        if (whiteness > floor) {
          const fade = Math.min(1, (whiteness - floor) / (ceil - floor));
          d[i+3] = Math.round(d[i+3] * (1 - fade));
        }
      }
    }
    octx.putImageData(data, 0, 0);
    const pad = 12;
    const cropX = Math.max(0, minX - pad);
    const cropY = Math.max(0, minY - pad);
    const cropW = Math.min(off.width, maxX + pad) - cropX;
    const cropH = Math.min(off.height, maxY + pad) - cropY;
    const canvas = document.createElement('canvas');
    canvas.width = cropW; canvas.height = cropH;
    canvas.className = imgEl.className.replace('logo-img', '') + ' logo-img h-8 w-auto';
    canvas.getContext('2d').drawImage(off, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
    imgEl.replaceWith(canvas);
  };
  img.src = src;
})();

function renderFilters() {
  const wrap = document.getElementById('columnFilters');
  const cats = ['all', ...Object.keys(CATEGORY_LABELS)];
  wrap.innerHTML = cats.map(c => `
    <button type="button" data-cat="${c}" class="col-filter-btn px-3.5 py-1.5 rounded-full text-xs font-semibold border transition ${c === 'all' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200 hover:border-brand'}">${c === 'all' ? `전체 (${COLUMNS.length})` : `${CATEGORY_LABELS[c]} (${COLUMNS.filter(x => x.category === c).length})`}</button>
  `).join('');
}

function renderList(cat) {
  const list = cat === 'all' ? COLUMNS : COLUMNS.filter(c => c.category === cat);
  document.getElementById('columnList').innerHTML = list.map(c => `
    <a href="${c.href}" class="block bg-white border border-gray-200 rounded-2xl p-5 hover:border-brand transition">
      <span class="text-[11px] font-semibold text-brand bg-brand-light px-2 py-0.5 rounded-full">${CATEGORY_LABELS[c.category]}</span>
      <h3 class="font-bold mt-2 mb-1.5 leading-snug">${c.title}</h3>
      <p class="text-sm text-gray-500 leading-relaxed">${c.desc}</p>
    </a>
  `).join('');
  document.getElementById('columnList').classList.toggle('hidden', list.length === 0);
  document.getElementById('columnEmpty').classList.toggle('hidden', list.length !== 0);
}

renderFilters();
renderList('all');

document.getElementById('columnFilters').addEventListener('click', (e) => {
  const btn = e.target.closest('.col-filter-btn');
  if (!btn) return;
  document.querySelectorAll('.col-filter-btn').forEach(b => {
    const active = b === btn;
    b.classList.toggle('bg-gray-900', active);
    b.classList.toggle('text-white', active);
    b.classList.toggle('border-gray-900', active);
    b.classList.toggle('bg-white', !active);
    b.classList.toggle('text-gray-600', !active);
    b.classList.toggle('border-gray-200', !active);
  });
  renderList(btn.dataset.cat);
});
</script>
